name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-demo/package-lock.json

      - run: npm ci

      # Build TRƯỚC: nó tái sinh .next/types/validator.ts mà tsc đọc. Chạy typecheck
      # trước sẽ đỏ oan khi vừa xoá/đổi tên một route.
      - run: npm run build

      # Cổng chất lượng — build một mình KHÔNG bắt được lỗi kiểu ngoài route, lỗi
      # format, hay class Tailwind trỏ tới token không tồn tại (scripts/check-tokens.mjs).
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:tokens

      # Cổng bề mặt phát hành — phải chạy SAU build vì nó đọc out/. Chặn deploy khi
      # lộ route đã nghỉ, mất h1, còn dấu vết booking hay có link nội bộ chết.
      - run: npm run check:release

      # Stop GitHub Pages from running Jekyll (it would drop the _next folder).
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-demo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
